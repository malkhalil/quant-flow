[tox]
envlist = py313,lint,type,coverage
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run unit tests with pytest
deps =
    pytest>=9.0.2
    pytest-asyncio>=1.3.0
commands =
    pytest {posargs:tests/}

[testenv:lint]
description = Run code quality checks with ruff
deps =
    ruff>=0.15.1
commands =
    ruff check quantflow/ tests/
    ruff format --check quantflow/ tests/

[testenv:coverage]
description = Run tests with coverage reporting
deps =
    pytest>=9.0.2
    pytest-asyncio>=1.3.0
    pytest-cov>=6.0.0
commands =
    pytest --cov=quantflow --cov-report=term-missing --cov-report=html {posargs:tests/}

[testenv:type]
description = Run type checking with mypy (if needed later)
deps =
    mypy>=1.0.0
skip_install = true
commands =
    mypy quantflow/

[gh-actions]
python =
    3.13: py313, lint, coverage
